# ----------------------------------------------------------------------------------------------------------- web app
agent:                          # the Copilot chat panel (kg/agent, app/view_chat.py)
  enabled: true
  max_steps: 5                  # model calls per question (tool calls included)
  turn_timeout_s: 75            # a question gives up after this (retries that would pass it end with "model not available")
  max_prompt_chars: 48000       # older tool results are dropped above this (Flash has no 14K tokens/min pacing like Gemma)

ui:
  extra_pages: false           # Q&A, version comparison, graph, evaluation (hidden for now)